:root{--blue:#193eab;--nav:#15369a;--navy:#142954;--bright:#2554c4;--yellow:#ffdc38;--pale:#edf2ff;--paper:#fff;--bg:#f7f8fa;--ink:#19253c;--sub:#566378;--line:#d7dde7;--soft:#e6eaf0;--jp:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;--sans:DealHunterJP,Arial,"Liberation Sans","DejaVu Sans",var(--jp);font-family:var(--sans);color:var(--ink);font-size:14px;background:var(--bg)}
*{box-sizing:border-box}body{margin:0;line-height:1.5;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}button,summary,a{touch-action:manipulation}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #4f75db;outline-offset:2px;z-index:2}a{color:inherit;text-decoration:none}h1,h2,h3,p,dl,dt,dd{margin:0}.sprite{position:absolute;width:0;height:0;overflow:hidden}.icon{width:17px;height:17px;display:inline-block;flex:none;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}.skip-link{position:absolute;left:6px;top:-80px;z-index:10;padding:8px;background:#fff}.skip-link:focus{top:8px}[hidden]{display:none!important}
.mast{background:var(--nav);color:white}.mast-inner{max-width:1710px;margin:auto;display:flex;align-items:stretch;gap:44px;padding:0 clamp(24px,3.2vw,60px);height:62px}.logo{display:flex;align-items:center;align-self:center;gap:7px;padding:0;white-space:nowrap}.logo>svg{width:38px;height:38px}.logo>span{font-family:Arial,"DejaVu Sans",sans-serif;font-size:30px;letter-spacing:-1.85px;font-style:italic;font-weight:800;line-height:1}.topnav{display:flex;align-self:stretch;gap:2px}.topnav button{display:flex;align-items:center;justify-content:center;gap:7px;padding:0 19px;color:#d7e1ff;font-size:13px;font-weight:550;position:relative}.topnav button .icon{width:15px;height:15px}.topnav button.active{color:#fff;background:#ffffff0d}.topnav button.active:after{content:'';position:absolute;left:16px;right:16px;bottom:0;height:4px;background:var(--yellow)}.topnav button:hover{background:#ffffff16;color:#fff}.nav-count{font:600 10px/16px var(--sans);padding:0 4px;min-width:16px;background:#344fa7;border:1px solid #8296cb;border-radius:3px}.account{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:12px}.division{border-right:1px solid #647aba;padding-right:14px;margin-right:3px;color:#d6dff7}.user-glyph{background:#dce7ff;color:#203b80;width:27px;height:27px;display:grid;place-items:center;border-radius:50%;font-weight:700}.user-name{font-size:12px;letter-spacing:.3px}
main{max-width:1710px;margin:0 auto;padding:0 clamp(24px,3.2vw,60px) 32px}.page-head{padding:24px 0 17px}.context{display:flex;align-items:center;gap:9px;font-size:11px;color:#5f697c;font-weight:500}.context-mark{width:13px;height:3px;background:var(--blue)}.sep{font-size:10px;color:#8993a3}.title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}.title-row>div{display:flex;align-items:baseline;gap:16px}.title-row h1{font-size:clamp(26px,2.2vw,34px);font-weight:700;letter-spacing:.005em;line-height:1.45;color:#11223f}.title-row p{font-size:12px;color:#66738a;font-weight:500}.new-btn,.detail-action,.d-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:white;padding:10px 15px;border-radius:4px;font-size:13px;font-weight:650}.new-btn{color:#172a53;background:var(--yellow);border:1px solid #dfbc24}.new-btn .icon{width:16px;height:16px;stroke-width:2.2}.new-btn:hover{background:#ffe361}.new-btn:active{background:#f5cc27}

  function taskDetail(){
    const t=tasks.find(t=>t.key===selectedTask);
    return fileHead('対応待ち　/　'+t.owner,t.project,t.title)+'<section class="file-section"><h3>対応内容</h3>'+factList([['受講者',t.person],['次の担当',t.owner],['担当営業',client]])+'<p class="body-copy">'+t.body+'</p><button type="button" class="detail-action" data-open="'+t.key+'">'+(t.key==='task-3'?'提出状況を見る':'入力内容をプレビュー')+icon('chevright')+'</button></section>'+back;
  }
  function knowledgeList(){
    return '<div class="view-list-head"><strong>面談で聞かれた質問</strong><span>3件</span></div>'+questions.map(q=>
      '<button type="button" class="agenda-row auxiliary-row'+(q.key===selectedQuestion?' selected':'')+'" data-question="'+q.key+'" aria-pressed="'+(q.key===selectedQuestion)+'"><span class="row-time"><span class="kind mark-meet">'+q.tag+'</span></span><strong class="row-title">'+q.title+'</strong><span class="row-person">'+eByKey(q.project).project+'</span><span class="row-arrow">'+icon('chevright')+'</span></button>'
    ).join('');
  }
  function knowledgeDetail(){
    const q=questions.find(q=>q.key===selectedQuestion);
    return fileHead('質問集　/　'+q.key,q.title)+'<section class="file-section"><h3>質問の記録</h3>'+factList([['案件',eByKey(q.project).project],['分類',q.tag]])+'<p class="body-copy">'+q.context+'</p><button type="button" data-show-event="'+q.project+'" class="detail-action">この案件の予定を見る'+icon('chevright')+'</button></section>'+back;
  }
  function rangeValue(){
    const a=datePart(start),b=datePart(start+6*day);
    return (a.getUTCMonth()+1)+'/'+pad(a.getUTCDate())+' – '+(b.getUTCMonth()+1)+'/'+pad(b.getUTCDate());
  }
  function render(){
    document.body.dataset.view=mode;
    document.querySelectorAll('[data-type]').forEach(button=>{
      button.classList.toggle('active',button.dataset.type===type);
      button.setAttribute('aria-pressed',String(button.dataset.type===type));
    });
    document.querySelectorAll('[data-tab]').forEach(button=>{
      button.classList.toggle('active',button.dataset.tab===mode);
      if(button.dataset.tab===mode)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');
    });
    const toolbar=document.querySelector('.list-toolbar'); if(toolbar)toolbar.hidden=mode!=='schedule';
    if(el('tab-title'))el('tab-title').textContent={schedule:'面談・入場予定',tasks:'対応待ち',knowledge:'質問集'}[mode];
    if(el('tab-sub')&&mode!=='schedule') el('tab-sub').textContent=mode==='tasks'?'担当案件と、次に対応する人を確認できます。':'過去の面談で聞かれた質問を案件ごとに確認できます。';
    if(el('tab-sub')&&mode==='schedule')el('tab-sub').textContent=initialSub;
    el('range-label').textContent=rangeValue();
    const list=activeEvents();
    if(mode==='schedule'&&!list.some(e=>e.key===selected)) selected=list.length?list[0].key:null;
    el('agenda').innerHTML=mode==='schedule'?scheduleList(list):mode==='tasks'?taskList():knowledgeList();
    el('inspector').innerHTML=mode==='schedule'?eventDetail(eByKey(selected)):mode==='tasks'?taskDetail():knowledgeDetail();
    calendar();
  }
  const initialSub=el('tab-sub')?.textContent||'';
  function newWindow(stamp){
    start=stamp;const d=datePart(stamp);month=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1);mode='schedule';
  }
  function selectEvent(e,reset){
    if(!e)return;
    if(reset){newWindow(e.stamp);type='all';}
    selected=e.key;
  }
  function focusListRow(){
    const s=el('agenda').querySelector('.selected');if(s)s.focus({preventScroll:true});
  }
  function focusDetail(){
    if(!window.matchMedia('(max-width: 900px)').matches){focusListRow();return;}
    const pane=el('inspector');pane.scrollIntoView({block:'start'});pane.tabIndex=-1;pane.focus({preventScroll:true});
  }
  document.addEventListener('click',ev=>{
    const b=ev.target.closest('button,a');if(!b)return;
    const d=b.dataset;
    if(d.tab){mode=d.tab;render();return;}
    if(d.type){mode='schedule';type=d.type;render();return;}
    if(d.date){newWindow(Number(d.date));render();return;}
    if(d.jump){
      const target=events.find(e=>e.stamp>=today&&e.type===d.jump);
      if(target){newWindow(today);type='all';selected=target.key;render();focusDetail();} return;
    }
    if(d.event){selectEvent(eByKey(d.event),false);render();focusDetail();return;}
    if(d.showEvent){selectEvent(eByKey(d.showEvent),true);render();focusDetail();return;}
    if(d.task){mode='tasks';selectedTask=d.task;render();focusDetail();return;}
    if(d.question){mode='knowledge';selectedQuestion=d.question;render();focusDetail();return;}
    if('backList' in d){el('agenda').scrollIntoView({block:'start'});focusListRow();return;}
    if(b.id==='prev-month'||b.id==='next-month'){
      const m=datePart(month);month=Date.UTC(m.getUTCFullYear(),m.getUTCMonth()+(b.id==='prev-month'?-1:1),1);calendar();return;
    }
    if(b.id==='week-prev'||b.id==='week-next'){newWindow(start+(b.id==='week-prev'?-7:7)*day);render();return;}
    if(b.id==='reset-today'||'reset' in d){newWindow(today);selected=events[0].key;type='all';render();}
  });
  render();
})();
</script></body></html>
